name: Personal CRM Linux checks

on:
  push:
    branches: [codex/personal-crm-reliability-web]
    paths: [personal-crm/**, .github/workflows/personal-crm.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-crm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: PostgreSQL, React and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: personal-crm
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crm_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONUTF8: "1"
      CRM_OPENAI_ENABLED: "false"
      CRM_MAIL_ENABLED: "false"
      CRM_MAIL_READ_CONSENT: "false"
      CRM_TELEGRAM_SEND_ENABLED: "false"
      CRM_TELEGRAM_WEBHOOK_ENABLED: "false"
      CRM_BACKUP_ENABLED: "false"
      CRM_S3_ENABLED: "false"
      CRM_CI_ADMIN_URL: postgresql+psycopg://crm_test:synthetic-ci-only@127.0.0.1:5432/postgres
      CRM_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install PostgreSQL 16 client and locked CRM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python --version
          node --version
          "$CRM_TEST_PG_BIN/pg_dump" --version
      - name: Create three new isolated databases
        run: |
          python scripts/ci_databases.py --output .runtime/ci-databases.env
          cat .runtime/ci-databases.env >> "$GITHUB_ENV"
      - name: CRM tests including migrations and actual PostgreSQL restore
        run: python -m pytest -q --tb=short --basetemp=.runtime/pytest-ci
      - name: Existing bot tests in a separate environment
        run: |
          python -m venv .runtime/legacy-venv
          .runtime/legacy-venv/bin/python -m pip install -r ../requirements.txt
          cd ..
          personal-crm/.runtime/legacy-venv/bin/python -m pytest tests -q --basetemp=personal-crm/.runtime/legacy-tests-ci
      - name: React tests and production bundle
        run: |
          cd web
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium --only-shell
      - name: Browser desktop/mobile on fresh owned synthetic services
        run: python scripts/browser_checks.py
      - name: Synthetic load and application restart persistence
        run: |
          python -m personal_crm.load_rehearsal --report .runtime/load-ci.json
          printf '### Synthetic Linux ASGI load\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat .runtime/load-ci.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n\nHTTP/TLS and VPS capacity are not measured by this load test.\n' >> "$GITHUB_STEP_SUMMARY"

  containers:
    name: Production images, HTTPS, restart and encrypted restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: personal-crm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install rehearsal dependencies
        run: |
          python -m pip install -r requirements.lock
          docker version
          docker compose version
      - name: Rehearse isolated production containers without external accounts
        run: python scripts/container_checks.py
      - name: Synthetic diagnostic logs on failure
        if: failure()
        run: |
          for log in .runtime/container-ci-*/commands.log; do
            if test -f "$log"; then tail -n 160 "$log"; fi
          done
