# Standalone file, never merge with the development compose.yaml.
# Compose >=2.30; env_file raw preserves the dollar signs in Argon2 hashes.
name: personal-crm-pilot
x-log: &log
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-app: &app
  image: ${CRM_IMAGE:?Set the verified immutable CRM image}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *log
  networks: [data]
  env_file: &identity
    - {path: /etc/personal-crm/database.env, format: raw}
    - {path: /etc/personal-crm/identity.env, format: raw}
  environment: &safe
    CRM_ENVIRONMENT: production
    CRM_OPENAI_ENABLED: "false"
    CRM_MAIL_ENABLED: "false"
    CRM_MAIL_READ_CONSENT: "false"
    CRM_WEB_INSECURE_LOCALHOST: "false"
  depends_on:
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: postgres:16.10
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *log
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: personal_crm
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm -d personal_crm"]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    restart: "no"
    mem_limit: 256m
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    mem_limit: 512m
    cpus: 1.0
    env_file:
      - {path: /etc/personal-crm/database.env, format: raw}
      - {path: /etc/personal-crm/identity.env, format: raw}
      - {path: /etc/personal-crm/web.env, format: raw}
      - {path: /etc/personal-crm/ingress.env, format: raw}
    networks: [data, proxy]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  source:
    <<: *app
    mem_limit: 256m
    cpus: 0.5
    command: [python, -m, personal_crm.source_worker]
  delivery:
    <<: *app
    profiles: [telegram]
    mem_limit: 256m
    cpus: 0.5
    env_file:
      - {path: /etc/personal-crm/database.env, format: raw}
      - {path: /etc/personal-crm/identity.env, format: raw}
      - {path: /etc/personal-crm/delivery.env, format: raw}
    command: [python, -m, personal_crm.worker]
    networks: [data, outbound]
  backup:
    <<: *app
    image: ${CRM_BACKUP_IMAGE:?Set the verified immutable backup image}
    profiles: [backup]
    mem_limit: 384m
    cpus: 0.5
    env_file:
      - {path: /etc/personal-crm/database.env, format: raw}
      - {path: /etc/personal-crm/identity.env, format: raw}
      - {path: /etc/personal-crm/backup.env, format: raw}
    environment:
      <<: *safe
      CRM_PG_BIN: /usr/lib/postgresql/16/bin
      CRM_BACKUP_DIRECTORY: /var/lib/crm-backup
      CRM_ERASURE_LEDGER: /var/lib/crm-ledger/erasures.crme
    volumes:
      - /srv/personal-crm/backups:/var/lib/crm-backup
      - /srv/personal-crm/ledger:/var/lib/crm-ledger
    command: [python, -m, personal_crm.remote_backup]
    networks: [data, outbound]
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *log
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CRM_HOST: ${CRM_HOST:?Set the approved DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy: {ipv4_address: 172.30.71.2}
    depends_on:
      api: {condition: service_started}
networks:
  data: {internal: true}
  outbound: {}
  proxy:
    ipam:
      config: [{subnet: 172.30.71.0/28}]
volumes:
  postgres: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  db-password: {file: /etc/personal-crm/db-password}
