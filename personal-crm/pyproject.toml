[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-crm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.3", "SQLAlchemy==2.0.41", "psycopg[binary]==3.2.9", "alembic==1.16.1", "pydantic==2.11.5", "openai==3.31.0", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
